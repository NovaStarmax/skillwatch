version: 2

models:
  - name: stg_stackoverflow_latest
    description: Une ligne par répondant Stack Overflow, colonnes renommées en snake_case, salaire casté en numeric. Format "large" conservé (skills toujours sous forme de chaînes délimitées par ";").
    columns:
      - name: response_id
        description: Identifiant unique du répondant.
        data_tests:
          - unique
          - not_null
      - name: salary_usd
        description: Rémunération annuelle en USD. Nullable — environ 51% des répondants ne renseignent pas cette question dans l'enquête source, ce n'est pas une anomalie de données.

  - name: stg_stackoverflow_archive
    description: Une ligne par répondant par année Stack Overflow (archive 2021-2024), colonnes renommées en snake_case, salaire casté en numeric. Format "large" conservé (skills toujours sous forme de chaînes délimitées par ";"). Clé logique composite (survey_year, response_id) — response_id repart à 1 chaque année.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - survey_year
              - response_id
    columns:
      - name: response_id
        description: Identifiant du répondant, unique seulement au sein d'une année donnée (pas de contrainte unique seule ici — cf. test composite ci-dessus).
        data_tests:
          - not_null
      - name: survey_year
        description: Année de l'enquête (2021 à 2024).
        data_tests:
          - not_null
      - name: salary_usd
        description: Rémunération annuelle en USD. Nullable — non-réponse à la question dans l'enquête source, ce n'est pas une anomalie de données.

  - name: stg_openclassrooms_trainings
    description: Une ligne par formation OpenClassrooms retenue après filtre domaine.
    columns:
      - name: url
        description: URL de la formation, identifiant logique unique.
        data_tests:
          - unique
          - not_null

  - name: stg_openclassrooms_skills
    description: Un skill brut par ligne pour chaque formation (une formation a plusieurs lignes) — pas de contrainte d'unicité sur url seul ici.
    columns:
      - name: url
        description: URL de la formation (référence stg_openclassrooms_trainings.url).
        data_tests:
          - not_null
      - name: skill_raw
        description: Skill brut extrait de la page détail, non matché contre le mapping.
        data_tests:
          - not_null

  - name: stg_france_travail
    description: Une ligne par offre France Travail déduplicée, colonnes reprises telles quelles depuis raw_france_travail — aucun parsing salaire ni jointure ici.
    columns:
      - name: external_id
        description: Identifiant de l'offre, identifiant logique unique.
        data_tests:
          - unique
          - not_null

  - name: stg_france_travail_skills
    description: Relation offre ↔ skill canonique déjà matchée côté Python — pas de jointure skills_mapping nécessaire ici contrairement aux autres sources.
    columns:
      - name: external_id
        description: Identifiant de l'offre (référence stg_france_travail.external_id).
        data_tests:
          - not_null
      - name: canonical_skill
        description: Nom canonique du skill déjà matché.
        data_tests:
          - not_null
