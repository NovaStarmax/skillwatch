version: 2

sources:
  - name: raw
    database: skillwatch_warehouse
    schema: public
    tables:
      - name: stackoverflow_latest
        identifier: raw_stackoverflow_latest
        description: >
          Chargement quasi brut du CSV Stack Overflow Developer Survey (édition la plus récente), une ligne par répondant.
          Note : MiscTechHaveWorkedWith n'existe pas dans cette édition (colonne retirée par Stack Overflow d'une année sur l'autre) — absent volontairement des colonnes déclarées ci-dessous.
        loaded_at_field: loaded_at
        columns:
          - name: ResponseId
            description: Identifiant unique du répondant.
          - name: LanguageHaveWorkedWith
            description: Langages utilisés, valeurs séparées par ";".
          - name: DatabaseHaveWorkedWith
            description: Bases de données utilisées, valeurs séparées par ";".
          - name: PlatformHaveWorkedWith
            description: Plateformes/cloud utilisées, valeurs séparées par ";".
          - name: WebframeHaveWorkedWith
            description: Frameworks web utilisés, valeurs séparées par ";".
          - name: ConvertedCompYearly
            description: Rémunération annuelle convertie en USD.
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.

      - name: openclassrooms_trainings
        identifier: raw_openclassrooms_trainings
        description: >
          Chargement quasi brut des formations OpenClassrooms scrapées, une ligne par formation
          retenue après filtre domaine (Data, Développement, Systèmes & Réseaux, Cybersécurité).
        loaded_at_field: loaded_at
        columns:
          - name: title
            description: Titre de la formation.
          - name: domain
            description: Domaine de la formation.
          - name: level
            description: Niveau de la formation.
          - name: duration_months
            description: Durée de la formation en mois (temps plein).
          - name: url
            description: URL de la page formation, identifiant logique unique.
          - name: provider
            description: Toujours "OpenClassrooms".
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.

      - name: openclassrooms_skills
        identifier: raw_openclassrooms_skills
        description: >
          Couples (url, skill_raw) — un skill brut extrait par ligne, pour chaque formation traitée
          (page détail scrapée), texte libre non matché contre le mapping.
        loaded_at_field: loaded_at
        columns:
          - name: url
            description: URL de la formation (référence vers openclassrooms_trainings.url).
          - name: skill_raw
            description: Skill brut extrait de la page détail, normalisé en lowercase/trim, non matché.
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.

      - name: france_travail
        identifier: raw_france_travail
        description: >
          Chargement quasi brut des offres d'emploi France Travail (mots-clés data engineer,
          data scientist, développeur python, machine learning), une ligne par offre déduplicée
          sur external_id. Sans parsing salaire ni matching skills — juste la réponse API aplatie.
        loaded_at_field: loaded_at
        columns:
          - name: external_id
            description: Identifiant de l'offre côté France Travail, identifiant logique unique.
          - name: title
            description: Intitulé de l'offre.
          - name: description
            description: Description de l'offre.
          - name: company
            description: Nom de l'entreprise (peut être absent selon l'offre).
          - name: location
            description: Libellé du lieu de travail.
          - name: commune
            description: Code commune INSEE du lieu de travail ; les 2 premiers caractères donnent le département. Chaîne vide si non renseigné par l'API.
          - name: contract_type
            description: Type de contrat.
          - name: published_at
            description: Date de création de l'offre, telle que renvoyée par l'API (texte).
          - name: salaire_libelle
            description: Libellé salaire brut tel que renvoyé par l'API, à parser (ex. "Annuel de 45000.0 Euros à 50000.0 Euros sur 12 mois").
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.

      - name: france_travail_skills_matched
        identifier: raw_france_travail_skills_matched
        description: >
          Couples (external_id, canonical_skill) déjà matchés côté Python (script de matching
          indépendant et replayable, network-free) — pas de jointure skills_mapping nécessaire ici
          contrairement aux autres sources.
        loaded_at_field: loaded_at
        columns:
          - name: external_id
            description: Identifiant de l'offre (référence raw_france_travail.external_id).
          - name: canonical_skill
            description: Nom canonique du skill déjà matché.
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.

      - name: stackoverflow_archive
        identifier: raw_stackoverflow_archive
        description: >
          Chargement quasi brut des CSV Stack Overflow Developer Survey (archive 2021-2024, un fichier par année),
          une ligne par répondant par année. Clé logique (survey_year, response_id) : response_id repart à 1 chaque année.
        loaded_at_field: loaded_at
        columns:
          - name: response_id
            description: Identifiant du répondant, unique seulement au sein d'une année donnée.
          - name: survey_year
            description: Année de l'enquête, extraite du nom du fichier CSV source.
          - name: LanguageHaveWorkedWith
            description: Langages utilisés, valeurs séparées par ";".
          - name: DatabaseHaveWorkedWith
            description: Bases de données utilisées, valeurs séparées par ";".
          - name: PlatformHaveWorkedWith
            description: Plateformes/cloud utilisées, valeurs séparées par ";".
          - name: WebframeHaveWorkedWith
            description: Frameworks web utilisés, valeurs séparées par ";".
          - name: MiscTechHaveWorkedWith
            description: Technologies diverses utilisées, valeurs séparées par ";".
          - name: ToolsTechHaveWorkedWith
            description: Outils utilisés, valeurs séparées par ";".
          - name: ConvertedCompYearly
            description: Rémunération annuelle convertie en USD.
          - name: loaded_at
            description: Horodatage du chargement dans la table raw.
