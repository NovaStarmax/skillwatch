version: 2

models:
  - name: skills
    description: >
      Table finale (matérialisée) — dimension skill : une ligne par canonical_skill distinct
      toutes sources confondues (union de stackoverflow_skills, training_skills,
      job_offer_skills), enrichie de sa catégorie (seed skills_categories, 'unknown' si
      absente). Remplace le rôle de skillwatch_db.skills.category côté legacy.
    columns:
      - name: skill_name
        description: Nom canonique du skill, union distincte des 3 marts sources.
        data_tests:
          - unique
          - not_null
      - name: category
        description: Catégorie du skill (seed skills_categories), 'unknown' si non répertorié.
        data_tests:
          - not_null

  - name: market_summary
    description: >
      Table finale (matérialisée) — une ligne par skill (base : marts.skills, 306 lignes),
      reproduisant le calcul de src/transform/normalizer.py (legacy skillwatch_db.market_summary).
      LEFT JOIN partout depuis skills : un skill sans offre/formation/stat doit apparaître
      avec des 0/NULL, jamais disparaître. developer_usage_count/avg_salary_eur filtrés sur
      survey_year = 2025 uniquement (archive 2021-2024 intentionnellement exclue, fidèle au
      legacy). avg_salary_eur applique un taux USD->EUR (0.92) codé en dur hérité du legacy,
      dette technique documentée en ligne, pas un choix fait ici.
    columns:
      - name: skill_name
        data_tests:
          - unique
          - not_null

  - name: stackoverflow_skills
    description: >
      Table finale (matérialisée) — une ligne par skill canonique et par année, toutes sources
      confondues : int_stackoverflow_skills (CSV latest, survey_year fixé à 2025) union
      int_stackoverflow_archive_skills (archive 2021-2024). Destinée à la lecture fréquente
      (future API), contrairement aux staging/intermediate qui restent des vues de calcul.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - canonical_skill
              - survey_year
    columns:
      - name: canonical_skill
        description: Nom canonique du skill (colonne skills_mapping.canonical_skill).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skills')
                field: skill_name
      - name: survey_year
        description: Année de l'enquête (2021 à 2025).
        data_tests:
          - not_null
      - name: usage_count
        description: Nombre de répondants distincts ayant ce skill, pour cette année.
        data_tests:
          - not_null
      - name: avg_salary_usd
        description: Salaire annuel moyen en USD des répondants ayant ce skill, pour cette année (NULL exclus du calcul).
        data_tests:
          - not_null

  - name: trainings
    description: Table finale (matérialisée) — une ligne par formation OpenClassrooms retenue, reprend stg_openclassrooms_trainings tel quel. Équivalent du schéma legacy trainings (skillwatch_db).
    columns:
      - name: url
        description: URL de la formation, identifiant logique unique.
        data_tests:
          - unique
          - not_null

  - name: training_skills
    description: Table finale (matérialisée) — relation formation ↔ skill canonique, reprend int_openclassrooms_skills tel quel. Équivalent du schéma legacy training_skills (skillwatch_db).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - url
              - canonical_skill
    columns:
      - name: url
        description: URL de la formation (référence trainings.url).
        data_tests:
          - not_null
      - name: canonical_skill
        description: Nom canonique du skill (colonne skills_mapping.canonical_skill).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skills')
                field: skill_name

  - name: job_offers
    description: Table finale (matérialisée) — une ligne par offre France Travail, reprend int_france_travail_offers tel quel. Équivalent du schéma legacy job_offers (skillwatch_db, filtré sur source = 'france_travail').
    columns:
      - name: external_id
        description: Identifiant de l'offre, identifiant logique unique.
        data_tests:
          - unique
          - not_null

  - name: job_offer_skills
    description: Table finale (matérialisée) — relation offre ↔ skill canonique, reprend stg_france_travail_skills tel quel. Équivalent de l'ancienne table de jointure legacy job_offer_skills (skillwatch_db).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - external_id
              - canonical_skill
    columns:
      - name: external_id
        description: Identifiant de l'offre (référence job_offers.external_id).
        data_tests:
          - not_null
      - name: canonical_skill
        description: Nom canonique du skill déjà matché.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skills')
                field: skill_name
