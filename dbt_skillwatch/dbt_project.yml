
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_skillwatch'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'skillwatch'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Formalise la convention déjà en place : staging/intermediate restent des vues de calcul,
# marts sont matérialisés en table pour la lecture fréquente. Les marts ont aussi leur
# config(materialized='table') explicite par fichier ; ce bloc évite qu'un futur modèle
# retombe silencieusement en view faute de config.
# +schema: marts (avec macros/generate_schema_name.sql) : les 5 modèles marts atterrissent
# dans skillwatch_warehouse.marts.*, pas public_marts.* — plus propre qu'un config répété
# par fichier.
models:
  dbt_skillwatch:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +schema: marts
