seeds:
  - name: departments
    columns:
      - name: dep
        data_tests:
          - unique
          - not_null
      - name: population
        data_tests:
          - not_null

  - name: skills_mapping
    description: Référentiel alias → skill canonique (~450 entrées), joint dans les modèles staging/intermediate de 3 sources (Stack Overflow latest/archive, OpenClassrooms). Un alias dupliqué dupliquerait silencieusement les lignes de toutes ces jointures.
    columns:
      - name: alias
        data_tests:
          - unique
          - not_null
      - name: canonical_skill
        data_tests:
          - not_null

  - name: skills_categories
    description: >
      Taxonomie manuelle skill → catégorie (308 associations), portée depuis l'ancien
      sql/seed_skill_categories.sql (legacy skillwatch_db.skills.category). Deux noms
      (Databricks, Git) apparaissaient dans deux UPDATE successifs avec des catégories
      différentes dans le fichier source ; la catégorie retenue ici est celle du dernier
      UPDATE (sémantique reproduite : bigdata et tool respectivement), comme l'aurait
      produit l'exécution séquentielle du script SQL d'origine.
    columns:
      - name: skill_name
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
